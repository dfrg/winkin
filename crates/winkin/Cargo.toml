[package]
name = "winkin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/winkin"
readme = "README.md"
description = "CSS inline layout: text, inline boxes, floats and ruby set into lines of positioned glyphs, with carets, hit testing and selection."
keywords = ["text", "layout", "css", "typography", "bidi"]
categories = ["text-processing", "graphics", "no-std"]
# The sources and the licenses. The tests and examples read fonts from the
# repository's `support/testing`, which is not published.
include = [
    "/src/**/*.rs",
    "!/src/**/tests.rs",
    "!/src/**/tests/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
# A module with children is `foo/mod.rs`, never `foo.rs` beside a `foo/`
# folder, so that a module's files are all in its folder. It holds for every
# target: an integration test with children is `tests/foo/main.rs`.
self_named_module_files = "deny"

[features]
default = ["std", "dictionaries"]

# Nothing here needs std: every table is a Vec, every lookup is ours. Off, the
# crate is no_std with alloc, as fontwich is, for wasm and embedded hosts. On,
# it passes std on to fontwich, which then reads fonts named by path, and to
# read-fonts and harfrust, whose float maths then need no libm.
std = ["fontwich/std", "read-fonts/std", "harfrust/std"]

# The word dictionaries of the scripts whose words need more than rules. On,
# `cleft`'s dictionaries of Thai, Lao, Khmer, Myanmar, and Chinese
# and Japanese, generated from ICU's word lists (2.7 MB), are the context's
# by default: they break Thai, Lao, Khmer and Myanmar lines, and find the
# words of all five for word motion and `capitalize`, as ICU4C's do in
# Chrome. Off, the context has no dictionary unless the host sets one, a run
# of those four scripts breaks only around it and is one word, and Chinese
# and Japanese words follow UAX #29's own rules, an ideograph or a hiragana
# a word of its own and a run of katakana one.
dictionaries = ["cleft/dictionaries"]

# Runtime dependencies are limited to fontwich (and what it brings), parlance,
# harfrust, read-fonts, cleft and hashbrown. The versions of
# the font crates are the workspace's.
[dependencies]
# The fonts a context sets text in. Only its core: no platform
# font system, which is the host's to ask for by enabling fontwich's `system`
# feature itself.
fontwich = { version = "0.1.0", path = "../fontwich", default-features = false }

# The lock that guards fonts shared between contexts, without `std`; with
# `std` it is `std`'s. fontwich's version, already in the build.
spin = { version = "0.12.3", default-features = false, features = ["mutex", "spin_mutex"] }

# The value types the text stack shares -- weights, widths, slopes, OpenType
# tags, feature and variation settings, languages, family names, the wrapping
# keywords -- so that a caller's style needs no conversion at the boundary.
# Already in the build through fontwich, at the same version.
parlance = { version = "0.1.0", default-features = false }

# The tables styles and their lists are interned through, which keep their
# capacity when cleared. fontwich's version, with no default
# features: no hasher seeded from a process-wide static, since the crate
# supplies a fixed one.
hashbrown = { version = "0.17", default-features = false }

# The character properties every stage reads, packed in two words per code
# point, with the CSS classes (`css`) and the full case mapping
# `text-transform` reads (`case`); and the grapheme, line and word
# segmenters, with the dictionaries `dictionaries` compiles in.
cleft = { version = "0.1.0", path = "../cleft", features = ["css", "case"] }

# A font held whole, one per font instance (`read_fonts::model::Font`): its
# bytes at the instance's coordinates, the tables harfrust
# shapes with, parsed once on it, and the metrics the font stage sets lines
# by, the font's own with `MVAR` applied and `BASE` read; its glyphs'
# advances with `HVAR` applied, and their bounds -- `glyf`'s boxes, an
# outline's points at the coordinates, a charstring's -- where `OS/2` gives
# no x-height, for an initial letter's ink, the probes
# `text-spacing-trim` reads and the vertical origins; and
# its character map. The raw tables too: `vmtx`, `VORG`, `GSUB`'s features
# and lookups. The workspace's version, fontwich's and harfrust's. `libm` for
# the float maths it needs without std.
read-fonts = { workspace = true, features = ["libm"] }

# The shaper, a port of HarfBuzz, which the shaping stage calls,
# shaping in the read-fonts font each used font holds, and whose canonical
# decomposition, composition and combining classes font coverage replays its
# normalizer on (`unicode/normalize.rs`). The workspace's version, on
# the read-fonts fontwich and winkin read. Without its default features, so
# without std; `libm` for the float maths it needs then. Its own Unicode
# tables, Unicode 18 at this release, not ICU's: the `icu` feature pins an
# older icu_properties than the crate's.
harfrust = { workspace = true, features = ["libm"] }

[dev-dependencies]
# ICU's own normalizers to NFD and NFC, with their data compiled in: the
# oracle the tests hold harfrust's canonical decomposition, composition and
# combining classes to, built up into whole forms, on which font coverage
# replays harfrust's normalizer (`unicode/normalize.rs`).
# icu_properties's version. Nothing at runtime reads it.
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }

# The bidi conformance tests take each character's class and paired bracket
# from icu_properties, and the spacing and normalization tests its general
# categories. Nothing at runtime reads it.
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data"] }

# The fonts built in memory that the unit tests and the integration tests set
# text in, and the allocator that counts their allocations. A crate of its
# own, depending on fontwich alone, so that both kinds of test reach it.
testing = { path = "../../support/testing" }
