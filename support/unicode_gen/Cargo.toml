[package]
name = "unicode_gen"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Generates cleft's packed Unicode property and case tables, and its word dictionaries."

# The generator reads the pinned UCD files and ICU word lists in `data/`,
# which `cargo run -p unicode_gen -- fetch` downloads (see README.md), and
# nothing else: packtab finds the three-level layout of each word. cleft's sweep
# tests check what it writes against icu_properties and icu_casemap.
[dependencies]
packtab = "1.9.0"
